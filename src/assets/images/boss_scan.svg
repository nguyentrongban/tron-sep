<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges">
  <!-- Sếp Flashlight Scanner State ("Đi kiểm tra" - IMG_2628.png / IMG_2625.png) -->
  
  <!-- Shadow under character -->
  <ellipse cx="16" cy="30" rx="11" ry="2" fill="rgba(0, 0, 0, 0.25)" />

  <!-- Back Hair & Ears -->
  <rect x="7" y="5" width="18" height="11" fill="#1e111a" />
  <rect x="6" y="9" width="20" height="4" fill="#1e111a" />
  <rect x="5" y="10" width="1" height="2" fill="#fed7aa" /> <!-- Left Ear -->
  <rect x="26" y="10" width="1" height="2" fill="#fed7aa" /> <!-- Right Ear -->

  <!-- Face Skin Tone Base -->
  <rect x="8" y="7" width="16" height="10" fill="#fed7aa" />
  
  <!-- Front Combed Volume Hair -->
  <rect x="8" y="3" width="16" height="3" fill="#1e111a" />
  <rect x="9" y="2" width="14" height="1" fill="#2d1e29" /> <!-- Hair volume top -->
  <rect x="7" y="6" width="2" height="6" fill="#1e111a" /> <!-- Left side lock -->
  <rect x="23" y="6" width="2" height="6" fill="#1e111a" /> <!-- Right side lock -->

  <!-- Thick Square Designer Glasses Frame -->
  <rect x="9" y="8" width="6" height="5" fill="#000000" />
  <rect x="17" y="8" width="6" height="5" fill="#000000" />
  <rect x="15" y="10" width="2" height="1" fill="#000000" /> <!-- Glasses Bridge -->
  <!-- Glasses Glass (White reflective inner) -->
  <rect x="10" y="9" width="4" height="3" fill="#ffffff" />
  <rect x="18" y="9" width="4" height="3" fill="#ffffff" />
  <!-- Suspicious Squinting Eyes (looking to the left scanning) -->
  <rect x="10" y="10" width="2" height="2" fill="#111827" />
  <rect x="18" y="10" width="2" height="2" fill="#111827" />

  <!-- Raised curious eyebrow (IMG_2625.png) -->
  <rect x="9" y="6.5" width="5" height="1.2" fill="#000000" />
  <rect x="18" y="7" width="5" height="1.2" fill="#000000" />
  
  <!-- Rosy Blush Cheeks -->
  <rect x="8" y="13" width="2" height="1" fill="rgba(244, 63, 94, 0.45)" />
  <rect x="22" y="13" width="2" height="1" fill="rgba(244, 63, 94, 0.45)" />

  <!-- Curious squint mouth -->
  <rect x="14" y="15" width="4" height="1.2" fill="#111827" />

  <!-- Torso: Navy Blue Corporate Suit -->
  <rect x="9" y="17" width="14" height="8" fill="#1e243b" />
  
  <!-- White Shirt Collar & Sharp Red Tie -->
  <rect x="14" y="17" width="4" height="2" fill="#ffffff" />
  <rect x="15" y="18" width="2" height="5" fill="#dc2626" /> <!-- Red Tie -->
  <rect x="14" y="21" width="4" height="1" fill="#dc2626" />

  <!-- Blue ID Badge Lanyard -->
  <rect x="12" y="17" width="1" height="3" fill="#3b82f6" />
  <rect x="19" y="17" width="1" height="3" fill="#3b82f6" />
  <rect x="12" y="20" width="2" height="3" fill="#ffffff" /> <!-- ID Badge -->
  <rect x="12" y="20" width="2" height="1" fill="#3b82f6" />

  <!-- Dark Trousers -->
  <rect x="10" y="25" width="12" height="4" fill="#111827" />

  <!-- Shiny Black Leather Shoes -->
  <rect x="9" y="29" width="5" height="1.5" fill="#020617" />
  <rect x="18" y="29" width="5" height="1.5" fill="#020617" />

  <!-- Flashlight Scanner (Held in Left Hand - IMG_2628.png) -->
  <rect x="23" y="19" width="5" height="2.2" fill="#9ca3af" /> <!-- Flashlight barrel -->
  <rect x="27" y="18" width="2" height="4.2" fill="#facc15" /> <!-- Gold lens tip -->
  
  <!-- Glowing Flashlight Cone beam extending to the right -->
  <path d="M 29 20 L 32 15 L 32 25 Z" fill="rgba(254, 240, 138, 0.4)" />
</svg>

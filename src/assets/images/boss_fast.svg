<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges">
  <!-- Sếp Fast Run / Chase State ("Đi nhanh" - IMG_2631.png / IMG_2620.png) -->
  
  <!-- Shadow under character (shifted because of run) -->
  <ellipse cx="14" cy="30" rx="10" ry="2" fill="rgba(0, 0, 0, 0.25)" />

  <!-- Wind streaks & dust cloud lines at the bottom left -->
  <rect x="2" y="27" width="6" height="1" fill="rgba(255, 255, 255, 0.6)" />
  <rect x="4" y="29" width="4" height="1" fill="rgba(255, 255, 255, 0.5)" />

  <!-- Run Lean Group: Rotated slightly forward (modeled here as shifted coordinates) -->
  <g transform="translate(-1, 0) rotate(-4 16 16)">
    <!-- Back Hair & Ears -->
    <rect x="8" y="5" width="18" height="11" fill="#1e111a" />
    <rect x="7" y="9" width="20" height="4" fill="#1e111a" />
    <rect x="6" y="10" width="1" height="2" fill="#fed7aa" /> <!-- Left Ear -->
    <rect x="27" y="10" width="1" height="2" fill="#fed7aa" /> <!-- Right Ear -->

    <!-- Face Skin Tone Base -->
    <rect x="9" y="7" width="16" height="10" fill="#fed7aa" />
    
    <!-- Front Combed Volume Hair -->
    <rect x="9" y="3" width="16" height="3" fill="#1e111a" />
    <rect x="10" y="2" width="14" height="1" fill="#2d1e29" /> <!-- Hair volume top -->
    <rect x="8" y="6" width="2" height="6" fill="#1e111a" /> <!-- Left side lock -->
    <rect x="24" y="6" width="2" height="6" fill="#1e111a" /> <!-- Right side lock -->

    <!-- Thick Square Designer Glasses Frame -->
    <rect x="10" y="8" width="6" height="5" fill="#000000" />
    <rect x="18" y="8" width="6" height="5" fill="#000000" />
    <rect x="16" y="10" width="2" height="1" fill="#000000" /> <!-- Glasses Bridge -->
    <!-- Angry Glowing Crimson Eyes -->
    <rect x="11" y="9" width="4" height="3" fill="#ef4444" />
    <rect x="19" y="9" width="4" height="3" fill="#ef4444" />
    <rect x="12" y="10" width="2" height="2" fill="#991b1b" /> <!-- Angry pupils -->

    <!-- Rosy Blush Cheeks -->
    <rect x="9" y="13" width="2" height="1" fill="rgba(244, 63, 94, 0.45)" />
    <rect x="23" y="13" width="2" height="1" fill="rgba(244, 63, 94, 0.45)" />

    <!-- Screaming/Shouting Angry Open Mouth -->
    <ellipse cx="17" cy="15" rx="2.5" ry="1.5" fill="#111827" />
    <rect x="16" y="14.5" width="2" height="1" fill="#ef4444" /> <!-- Red tongue indicator -->

    <!-- Forehead Red Anger Vein Pop (IMG_2630.png) -->
    <path d="M 23 4 L 27 8 M 27 4 L 23 8" stroke="#dc2626" stroke-width="1.2" />

    <!-- Torso: Navy Blue Corporate Suit -->
    <rect x="10" y="17" width="14" height="8" fill="#1e243b" />
    
    <!-- White Shirt Collar & Sharp Red Tie (fluttering with run) -->
    <rect x="15" y="17" width="4" height="2" fill="#ffffff" />
    <path d="M 16 18 L 19 23 L 17 23 Z" fill="#dc2626" /> <!-- Wind-blown Red Tie -->

    <!-- Clipboard Wooden Board & KPI Report ("Bực tức" - IMG_2620.png) -->
    <rect x="22" y="18" width="6" height="8" fill="#7c2d12" /> <!-- Wood Board -->
    <rect x="23" y="19" width="4" height="6" fill="#ffffff" /> <!-- Paper -->
    <!-- Scribbled charts on clipboard -->
    <rect x="24" y="20" width="2" height="1" fill="#3b82f6" />
    <rect x="24" y="22" width="2" height="1" fill="#ef4444" />
    <rect x="24" y="24" width="2" height="1" fill="#10b981" />

    <!-- Dark Trousers -->
    <rect x="11" y="25" width="12" height="4" fill="#111827" />

    <!-- Shiny Black Leather Shoes (legs spread running swing) -->
    <rect x="9" y="29" width="4" height="1.5" fill="#020617" />
    <rect x="19" y="29" width="4" height="1.5" fill="#020617" />
  </g>
</svg>
